<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>autohtml</title>
    <script src='https://code.jquery.com/jquery-3.5.1.min.js'></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.7/beautify.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.7/beautify-css.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.7/beautify-html.js"></script>
    <script src="smarteditor/js/HuskyEZCreator.js"></script>
    <script src="sample.js"></script>

        tailwind.config = {

    <link rel="stylesheet" href="css/default.css">
</head>

<body>
    <textarea id="input" cols="30" rows="10" aria-label="원본" hidden></textarea>
    <div id="html" hidden></div>
    <div class="layout">
        <div>
            <textarea id="nttCn" name="nttCn" cols="150" rows="10" hidden class="textarea" aria-label="sample code"></textarea>
            <form name=option class="options">
                <div>
                    <dl>
                        <dt>wrapper class</dt>
                        <dd>
                            <input type="text" name="className" id="className" value="bd-list">
                            <button type="button" value="bd-list" class="nameoption inline btn">bd-list</button>
                            <button type="button" value="bd-reg" class="nameoption inline btn">bd-reg</button>
                            <button type="button" value="bd-view" class="nameoption inline btn">bd-view</button>
                            <button type="button" id="addpreset" class="inline btn" title="현재 입력값을 프리셋으로 저장">＋</button>
                            <span id="custompresets"></span>
                        </dd>
                    </dl>
                    <dl>
                        <dt>table caption</dt>
                        <dd>
                            <input type="text" name="captionText" id="captionText" placeholder="표 제목 (비우면 빈 caption)">
                        </dd>
                    </dl>
                    <dl>
                        <dt>
                            OUTPUT style
                        </dt>
                        <dd>
                            <label>
                                <input type="radio" name="todl" value="merge">
                                
                                <!-- <input type="checkbox" name="merge"> -->
                                merge Table
                            </label>
                            <label>
                                <input type="radio" name="todl" value="col">
                                table list default
                            </label>
                            <label>
                                <input type="radio" name="todl" value="dl">
                                table → dl > dt + dd
                            </label>
                            <div class="inline-form-group">
                                <label>
                                    <input type="radio" name="todl" value="rowtable">
                                    row table
                                </label>
                                <label>
                                    th 열 번호
                                    <input type="text" name="rowthcols" id="rowthcols" value="1" title="쉼표로 구분 (예: 1,3,5)">
                                </label>
                            </div>
                            

                        </dd>
                    </dl>
                    <dl>
                        <dt>
                            tag delete option
                        </dt>
                        <dd>
                            <label>
                                <input type="checkbox" name="ptag" id="">
                                p
                            </label>
                            <label>
                                <input type="checkbox" name="divtag" id="">
                                div
                            </label>
                            <label>
                                <input type="checkbox" name="brtag" id="">
                                br
                            </label>
                            <label>
                                <input type="checkbox" name="spantag" id="">
                                span
                            </label>
                            <label>
                                <input type="checkbox" name="tdtextonly" id="">
                                td 내부 텍스트만 남김
                            </label>
                        </dd>
                    </dl>
                    <dl>
                        <dt>정리 옵션</dt>
                        <dd>
                            <label>
                                <input type="checkbox" name="officeclean">
                                오피스 잔재 정리
                            </label>
                            <label>
                                이미지
                                <select name="imgmode">
                                    <option value="keep">유지</option>
                                    <option value="remove">삭제</option>
                                    <option value="placeholder">빈 placeholder</option>
                                </select>
                            </label>
                        </dd>
                    </dl>
                    <dl>
                        <dt>attr delete option</dt>
                        <dd>
                            <label>
                                <input type="checkbox" name="style" class="att">
                                style
                            </label>
                            <label>
                                <input type="checkbox" name="class" class="att">
                                class
                            </label>
                            <label>
                                <input type="checkbox" name="id" class="att">
                                id
                            </label>
                        </dd>
                    </dl>
                </div>
            </form>

        </div>
        <div class="ge-btns">
            <button type="submit" class="generrator flex items-center w-full justify-center rounded-md bg-indigo-600 px-3 py-1.5 text-sm font-semibold leading-6 text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">변환</button>
            <button type="button" class="styleclear">엑셀복사용</button>
            <button type="button" id="removestyle" style="height: 200px;">스타일삭제</button>
        </div>
        <div><textarea id="output" cols="30" rows="10" aria-label="수정후"></textarea></div>
        <div class="preview-panel">
            <div class="preview-head">미리보기</div>
            <ul id="warnings" class="warnings" hidden></ul>
            <div id="outputhtml" class="preview-body"></div>
        </div>
    </div>
    <script>
        // document.querySelector('#nttCn').value = SAMPLEHTML
        /* 네이버 스마트 에디터  */
        // 추가 글꼴 목록
        //var aAdditionalFontSet = [["MS UI Gothic", "MS UI Gothic"], ["Comic Sans MS", "Comic Sans MS"],["TEST","TEST"]];
        var oEditors = [];
        nhn.husky.EZCreator.createInIFrame({
            oAppRef: oEditors,
            elPlaceHolder: "nttCn",
            sSkinURI: "./smarteditor/SmartEditor2Skin.html",
            htParams: {
                bUseToolbar: true,				// 툴바 사용 여부 (true:사용/ false:사용하지 않음)
                bUseVerticalResizer: true,		// 입력창 크기 조절바 사용 여부 (true:사용/ false:사용하지 않음)
                bUseModeChanger: true,			// 모드 탭(Editor | HTML | TEXT) 사용 여부 (true:사용/ false:사용하지 않음)
                //aAdditionalFontList : aAdditionalFontSet,		// 추가 글꼴 목록
                fOnBeforeUnload: function () {
                    //alert("완료!");
                }
            }, //boolean
            fOnAppLoad: function () {
                //예제 코드
                //oEditors.getById["nttCn"].exec("PASTE_HTML", "");
            },
            fCreator: "createSEditor2"
        })
    </script>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="goddamTransforce.js"></script>

</body>
